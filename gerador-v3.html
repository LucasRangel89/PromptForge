<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequenciador de Memórias — v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08070b;--s1:#0f0d16;--s2:#17141f;
  --border:#221f2e;--border2:#2e2a3f;
  --text:#e4dff4;--muted:#635d7a;
  --amber:#d4a843;--pink:#d96a9a;--teal:#3ecbb8;
  --purple:#9b7fe8;--coral:#e07a58;--sage:#6ec49a;
  --lime:#8cc43e;--magenta:#c03ec4;--rust:#e85a3c;--slate:#5a7cb8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:2rem 1.5rem 6rem;}
.wrap{max-width:900px;margin:0 auto;}

/* HEADER */
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.logo-col{}
.logo-row{display:flex;align-items:center;gap:8px;margin-bottom:.5rem;}
.logo-mark{width:28px;height:28px;border:1.5px solid var(--amber);border-radius:50%;position:relative;flex-shrink:0;}
.logo-mark::before,.logo-mark::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:1px;}
.logo-mark::before{width:1.5px;height:12px;background:var(--amber);}
.logo-mark::after{width:12px;height:1.5px;background:var(--amber);}
.logo-txt{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}
h1{font-size:2.2rem;font-weight:800;line-height:1.05;}
h1 em{font-style:normal;color:var(--amber);}
.tagline{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;line-height:1.7;margin-top:.4rem;max-width:500px;}
.io-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;padding-top:.2rem;}
.io-btn{
  padding:7px 14px;border-radius:8px;border:1px solid var(--border2);
  background:var(--s1);color:var(--muted);font-size:10px;
  font-family:'IBM Plex Mono',monospace;letter-spacing:1px;cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.io-btn:hover{color:var(--text);border-color:#3a3550;}
.io-btn.export-btn{border-color:var(--amber);color:var(--amber);}
.io-btn.export-btn:hover{background:rgba(212,168,67,.08);}

/* STRAND */
.strand{display:flex;gap:4px;margin-bottom:2rem;}
.strand-seg{height:3px;flex:1;border-radius:2px;background:var(--border2);transition:background .3s;}
.strand-seg.on{background:var(--gene-color);}

/* GENE BLOCK */
.gene-block{
  background:var(--s1);border:1px solid var(--border);
  border-radius:14px;padding:1.1rem 1.2rem 1rem;
  margin-bottom:.75rem;transition:border-color .2s;
}
.gene-block:hover{border-color:var(--border2);}
.gene-block.selected{border-color:var(--gene-color);}

.gene-head{display:flex;align-items:center;gap:7px;margin-bottom:.8rem;}
.badge{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;font-family:'IBM Plex Mono',monospace;
  background:rgba(var(--gene-rgb),.18);color:var(--gene-color);
}
.gene-name{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gene-color);}
.gene-hint{font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.lock-btn{
  margin-left:auto;background:none;border:1px solid var(--border2);
  border-radius:5px;padding:2px 8px;font-size:9px;
  font-family:'IBM Plex Mono',monospace;color:var(--muted);cursor:pointer;
  letter-spacing:1px;transition:all .2s;
}
.lock-btn:hover,.lock-btn.on{border-color:var(--gene-color);color:var(--gene-color);}
.lock-btn.on{background:rgba(var(--gene-rgb),.1);}

/* FILTER TABS */
.filter-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:.7rem;}
.ftab{
  padding:2px 9px;border-radius:12px;font-size:10px;
  border:1px solid var(--border2);background:transparent;
  color:var(--muted);cursor:pointer;font-family:'IBM Plex Mono',monospace;
  transition:all .15s;letter-spacing:.5px;
}
.ftab:hover{color:var(--text);}
.ftab.on{background:rgba(var(--gene-rgb),.15);border-color:var(--gene-color);color:var(--gene-color);}
.filter-sep{width:1px;height:16px;background:var(--border2);align-self:center;margin:0 2px;}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{
  padding:4px 12px;border-radius:20px;border:1px solid var(--border2);
  background:var(--s2);color:var(--muted);font-size:11.5px;
  cursor:pointer;transition:all .15s;user-select:none;
}
.chip:hover{color:var(--text);border-color:#3a3550;}
.chip.on{color:var(--gene-color);border-color:var(--gene-color);background:rgba(var(--gene-rgb),.12);font-weight:700;}
.chip.custom-chip{border-style:dashed;}
.chip-del{
  margin-left:4px;font-size:9px;opacity:.5;
  background:none;border:none;color:inherit;cursor:pointer;padding:0;
}
.chip-del:hover{opacity:1;}

/* ADD CHIP FORM */
.add-chip-toggle{
  padding:4px 10px;border-radius:20px;border:1px dashed var(--border2);
  background:transparent;color:var(--muted);font-size:11px;
  cursor:pointer;transition:all .2s;font-family:'IBM Plex Mono',monospace;
}
.add-chip-toggle:hover{border-color:var(--gene-color);color:var(--gene-color);}
.add-form{
  margin-top:.7rem;background:var(--s2);border-radius:10px;
  padding:.8rem;display:flex;flex-direction:column;gap:6px;
  border:1px solid var(--border2);
}
.add-form label{font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace;letter-spacing:1px;text-transform:uppercase;}
.add-form input,.add-form textarea{
  background:var(--s1);border:1px solid var(--border2);border-radius:6px;
  padding:6px 9px;color:var(--text);font-family:'IBM Plex Mono',monospace;
  font-size:11px;line-height:1.5;width:100%;outline:none;transition:border .2s;
  resize:vertical;
}
.add-form input:focus,.add-form textarea:focus{border-color:var(--gene-color);}
.add-form-row{display:flex;gap:6px;}
.add-btn{
  padding:5px 14px;border-radius:6px;border:1px solid var(--gene-color);
  background:rgba(var(--gene-rgb),.12);color:var(--gene-color);
  font-size:10px;font-family:'IBM Plex Mono',monospace;cursor:pointer;
  letter-spacing:1px;transition:all .2s;
}
.add-btn:hover{background:rgba(var(--gene-rgb),.25);}
.cancel-btn{
  padding:5px 10px;border-radius:6px;border:1px solid var(--border2);
  background:transparent;color:var(--muted);font-size:10px;
  font-family:'IBM Plex Mono',monospace;cursor:pointer;
}

/* GENE VAR SETS */
.g-icone     {--gene-color:var(--amber); --gene-rgb:212,168,67;}
.g-linguagem {--gene-color:var(--pink);  --gene-rgb:217,106,154;}
.g-universo  {--gene-color:var(--teal);  --gene-rgb:62,203,184;}
.g-torcao    {--gene-color:var(--purple);--gene-rgb:155,127,232;}
.g-assinatura{--gene-color:var(--coral); --gene-rgb:224,122,88;}
.g-tempero   {--gene-color:var(--sage);  --gene-rgb:110,196,154;}
.g-formato   {--gene-color:var(--lime);  --gene-rgb:140,196,62;}
.g-paleta    {--gene-color:var(--magenta);--gene-rgb:192,62,196;}
.g-escala    {--gene-color:var(--rust);  --gene-rgb:232,90,60;}
.g-camera    {--gene-color:var(--slate); --gene-rgb:90,124,184;}

/* HR */
hr{border:none;border-top:1px solid var(--border);margin:2rem 0;}

/* OUTPUT */
.out-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;}
.out-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.out-status{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--muted);}
.out-box{
  background:var(--s1);border:1px solid var(--border);border-radius:14px;
  padding:1.4rem;min-height:100px;font-family:'IBM Plex Mono',monospace;
  font-size:12px;line-height:1.9;color:var(--text);transition:border-color .3s;
}
.out-box.has-content{border-color:var(--border2);}
.ph{color:var(--muted);font-style:italic;}

/* output gene spans */
.og-icone     {background:rgba(212,168,67,.16); color:#d4a843;padding:1px 5px;border-radius:4px;}
.og-linguagem {background:rgba(217,106,154,.16);color:#d96a9a;padding:1px 5px;border-radius:4px;}
.og-universo  {background:rgba(62,203,184,.16); color:#3ecbb8;padding:1px 5px;border-radius:4px;}
.og-torcao    {background:rgba(155,127,232,.16);color:#9b7fe8;padding:1px 5px;border-radius:4px;}
.og-assinatura{background:rgba(224,122,88,.16); color:#e07a58;padding:1px 5px;border-radius:4px;}
.og-tempero   {background:rgba(110,196,154,.16);color:#6ec49a;padding:1px 5px;border-radius:4px;}
.og-formato   {background:rgba(140,196,62,.16); color:#8cc43e;padding:1px 5px;border-radius:4px;}
.og-paleta    {background:rgba(192,62,196,.16); color:#c03ec4;padding:1px 5px;border-radius:4px;}
.og-escala    {background:rgba(232,90,60,.16);  color:#e85a3c;padding:1px 5px;border-radius:4px;}
.og-camera    {background:rgba(90,124,184,.16); color:#5a7cb8;padding:1px 5px;border-radius:4px;}

/* CONTROLS */
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:.9rem;}
.btn{
  padding:9px 19px;border-radius:9px;border:1px solid var(--border2);
  background:var(--s1);color:var(--text);font-family:'Syne',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;transition:all .18s;letter-spacing:.5px;
}
.btn:hover{background:var(--s2);}
.btn.primary{background:var(--amber);color:#000;border-color:var(--amber);}
.btn.primary:hover{background:#c09430;border-color:#c09430;}
.btn.soft{color:var(--muted);}
.btn.copy{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;}
.btn.copy.ok{color:var(--teal);border-color:var(--teal);}

/* LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--border);}
.leg{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

/* HIDDEN */
.hidden{display:none!important;}

/* IMPORT NOTIFY */
.notify{
  position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);
  background:var(--s1);border:1px solid var(--teal);color:var(--teal);
  padding:.6rem 1.2rem;border-radius:8px;font-size:11px;
  font-family:'IBM Plex Mono',monospace;letter-spacing:1px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;
}
.notify.show{opacity:1;}

::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>
</head>
<body>
<div class="wrap">

<div class="top-bar">
  <div class="logo-col">
    <div class="logo-row">
      <div class="logo-mark"></div>
      <span class="logo-txt">Sequenciador de Memórias — v3.0</span>
    </div>
    <h1>Gerador de <em>Prompts Visuais</em></h1>
    <p class="tagline">10 genes · filtros por era e categoria · chips personalizados · import/export JSON</p>
  </div>
  <div class="io-btns">
    <button class="io-btn" onclick="document.getElementById('import-file').click()">⬆ Importar JSON</button>
    <button class="io-btn export-btn" onclick="exportJSON()">⬇ Exportar JSON</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(this)">
  </div>
</div>

<div class="strand" id="strand"></div>
<div id="genes-container"></div>

<hr>

<div class="out-header">
  <span class="out-label">▸ Prompt Gerado</span>
  <span class="out-status" id="out-status">0 / 10 genes</span>
</div>
<div class="out-box" id="out-box"><span class="ph">Selecione genes para construir o prompt...</span></div>
<div class="legend" id="legend"></div>
<div class="controls">
  <button class="btn primary" onclick="randomize(false)">⟳ Aleatorizar Tudo</button>
  <button class="btn" onclick="randomize(true)">⟳ Aleatorizar Livres</button>
  <button class="btn copy" id="copy-btn" onclick="copyPrompt()">COPIAR PROMPT</button>
  <button class="btn soft" onclick="clearAll()">Limpar Tudo</button>
</div>

</div>
<div class="notify" id="notify"></div>

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
const sel = {};
const selOut = {};
const locked = {};
const filterEra = {};
const filterCat = {};
const custom = {};
const addFormOpen = {};

function init(){
  GENES.forEach(g=>{
    sel[g.id]=null; selOut[g.id]=null;
    locked[g.id]=false;
    filterEra[g.id]='all'; filterCat[g.id]='all';
    addFormOpen[g.id]=false;
    const saved=localStorage.getItem('custom_'+g.id);
    custom[g.id]=saved?JSON.parse(saved):[];
  });
  renderAll();
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function renderAll(){
  renderGenesContainer();
  renderOutput();
  renderStrand();
  renderLegend();
}

function getFilteredOptions(gene){
  const all=[...gene.options, ...custom[gene.id].map(c=>({...c,isCustom:true}))];
  return all.filter(o=>{
    const eOk = !gene.filterBy||filterEra[gene.id]==='all'||o.era===filterEra[gene.id]||(filterEra[gene.id]==='intemporal'&&!o.era);
    const cOk = !gene.filterBy||filterCat[gene.id]==='all'||o.cat===filterCat[gene.id];
    return eOk && cOk;
  });
}

function renderGenesContainer(){
  const c=document.getElementById('genes-container');
  c.innerHTML='';
  GENES.forEach((gene,i)=>{
    const div=document.createElement('div');
    div.className=`gene-block ${gene.cls}${sel[gene.id]?' selected':''}`;
    div.id='gb-'+gene.id;
    
    // header
    let html=`<div class="gene-head">
      <div class="badge">${i+1}</div>
      <span class="gene-name">${gene.name}</span>
      <span class="gene-hint">// ${gene.hint}</span>
      <button class="lock-btn${locked[gene.id]?' on':''}" onclick="toggleLock('${gene.id}',this)">
        ${locked[gene.id]?'LOCKED ✓':'TRAVAR'}
      </button>
    </div>`;

    // filter tabs
    if(gene.filterBy){
      const eras=['all','70s','80s','90s','2000s','2010s','intemporal'];
      const eraLabels={all:'Todos',intemporal:'Intemporal'};
      const cats=['all',...new Set(gene.options.filter(o=>o.cat).map(o=>o.cat))];
      
      html+=`<div class="filter-row">`;
      eras.forEach(e=>{
        const hasOpts=e==='all'||gene.options.some(o=>e==='intemporal'?!o.era:o.era===e);
        if(!hasOpts) return;
        html+=`<button class="ftab${filterEra[gene.id]===e?' on':''}" onclick="setEra('${gene.id}','${e}')">${eraLabels[e]||e}</button>`;
      });
      if(cats.length>1){
        html+=`<div class="filter-sep"></div>`;
        cats.forEach(c=>{
          html+=`<button class="ftab${filterCat[gene.id]===c?' on':''}" onclick="setCat('${gene.id}','${c}')">${c==='all'?'Todas Cats.':c}</button>`;
        });
      }
      html+=`</div>`;
    }

    // chips
    html+=`<div class="chips" id="chips-${gene.id}">`;
    getFilteredOptions(gene).forEach(opt=>{
      const isOn=sel[gene.id]===opt.label;
      html+=`<div class="chip${isOn?' on':''}${opt.isCustom?' custom-chip':''}" onclick="pickOpt('${gene.id}','${esc(opt.label)}','${esc(opt.out)}')">
        ${opt.label}${opt.isCustom?`<button class="chip-del" onclick="event.stopPropagation();delCustom('${gene.id}','${esc(opt.label)}')">✕</button>`:''}
      </div>`;
    });
    html+=`</div>`;

    // add chip toggle
    html+=`<div style="margin-top:7px;">
      <button class="add-chip-toggle" onclick="toggleAddForm('${gene.id}')">+ chip personalizado</button>
    </div>`;

    // add form (hidden by default)
    html+=`<div class="add-form${addFormOpen[gene.id]?'':' hidden'}" id="addform-${gene.id}">
      <div>
        <label>Nome do chip</label>
        <input type="text" id="addlabel-${gene.id}" placeholder="Ex: Criança Prodígio">
      </div>
      <div>
        <label>Texto do prompt (em inglês)</label>
        <textarea id="addout-${gene.id}" rows="2" placeholder="Ex: a child prodigy in formal attire, intense concentration"></textarea>
      </div>
      <div class="add-form-row">
        <button class="add-btn" onclick="addCustomChip('${gene.id}')">Adicionar</button>
        <button class="cancel-btn" onclick="toggleAddForm('${gene.id}')">Cancelar</button>
      </div>
    </div>`;

    div.innerHTML=html;
    c.appendChild(div);
  });
}

function esc(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;');}

// ═══════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════
function pickOpt(id,label,out){
  if(sel[id]===label){sel[id]=null;selOut[id]=null;}
  else{sel[id]=label;selOut[id]=out;}
  document.querySelectorAll(`#chips-${id} .chip`).forEach(c=>{
    c.classList.toggle('on', c.textContent.trim().startsWith(label));
  });
  const gb=document.getElementById('gb-'+id);
  if(gb) gb.classList.toggle('selected',!!sel[id]);
  renderOutput();
  renderStrand();
}

function toggleLock(id,btn){
  locked[id]=!locked[id];
  btn.classList.toggle('on',locked[id]);
  btn.textContent=locked[id]?'LOCKED ✓':'TRAVAR';
}

function setEra(id,val){
  filterEra[id]=val;
  renderGenesContainer();
  renderOutput();
}

function setCat(id,val){
  filterCat[id]=val;
  renderGenesContainer();
  renderOutput();
}

function toggleAddForm(id){
  addFormOpen[id]=!addFormOpen[id];
  const el=document.getElementById('addform-'+id);
  if(el) el.classList.toggle('hidden',!addFormOpen[id]);
}

function addCustomChip(id){
  const labelEl=document.getElementById('addlabel-'+id);
  const outEl=document.getElementById('addout-'+id);
  const label=labelEl.value.trim();
  const out=outEl.value.trim();
  if(!label||!out){alert('Preencha os dois campos.');return;}
  if(custom[id].some(c=>c.label===label)){alert('Já existe um chip com esse nome.');return;}
  custom[id].push({label,out});
  localStorage.setItem('custom_'+id, JSON.stringify(custom[id]));
  addFormOpen[id]=false;
  renderGenesContainer();
  notify(`Chip "${label}" adicionado!`);
}

function delCustom(id,label){
  custom[id]=custom[id].filter(c=>c.label!==label);
  localStorage.setItem('custom_'+id, JSON.stringify(custom[id]));
  if(sel[id]===label){sel[id]=null;selOut[id]=null;}
  renderGenesContainer();
  renderOutput();
  renderStrand();
}

  tempero:   {pre:'',           suf:''},
  formato:   {pre:'Format: ',   suf:''},
  paleta:    {pre:'',           suf:''},
  escala:    {pre:'',           suf:''},
  camera:    {pre:'',           suf:''},
};

function buildParts(forCopy){
  const parts=[];
  const order=['linguagem','icone','torcao','universo','escala','camera','paleta','formato','assinatura','tempero'];
  const joiners={
    linguagem:'',icone:'',torcao:'',universo:'. ',escala:'',camera:'',
    paleta:'',formato:'',assinatura:'',tempero:''
  };
  order.forEach(id=>{
    if(!selOut[id]) return;
    parts.push({id, text: ROLES[id].pre + selOut[id] + ROLES[id].suf});
  });
  if(parts.length===0) return null;
  parts.push({id:'static', text:'Highly detailed. Masterpiece quality.'});
  return parts;
}

function renderOutput(){
  const box=document.getElementById('out-box');
  const status=document.getElementById('out-status');
  const count=GENES.filter(g=>sel[g.id]).length;
  status.textContent=`${count} / ${GENES.length} genes ativos`;

  const parts=buildParts(false);
  if(!parts){
    box.innerHTML='<span class="ph">Selecione genes para construir o prompt...</span>';
    box.classList.remove('has-content');
    return;
  }
  box.classList.add('has-content');
  box.innerHTML=parts.map(p=>{
    if(p.id==='static') return `<span style="color:var(--muted);font-size:11px"> · ${p.text}</span>`;
    return `<span class="og-${p.id}">${p.text}</span>`;
  }).join(`<span style="color:var(--border2)"> · </span>`);
}

function getPlainPrompt(){
  const order=['linguagem','icone','torcao','universo','escala','camera','paleta','formato','assinatura','tempero'];
  const parts=order.filter(id=>selOut[id]).map(id=>ROLES[id].pre+selOut[id]+ROLES[id].suf);
  if(!parts.length) return null;
  parts.push('Highly detailed. Masterpiece quality.');
  return parts.join(' · ');
}

// ═══════════════════════════════════════════════════
// STRAND & LEGEND
// ═══════════════════════════════════════════════════
const GENE_COLORS={
  icone:'#d4a843',linguagem:'#d96a9a',universo:'#3ecbb8',
  torcao:'#9b7fe8',assinatura:'#e07a58',tempero:'#6ec49a',
  formato:'#8cc43e',paleta:'#c03ec4',escala:'#e85a3c',camera:'#5a7cb8'
};

function renderStrand(){
  const s=document.getElementById('strand');
  s.innerHTML=GENES.map(g=>`<div class="strand-seg${sel[g.id]?' on':''}" style="${sel[g.id]?'--gene-color:'+GENE_COLORS[g.id]:''};${sel[g.id]?'background:'+GENE_COLORS[g.id]:''}"></div>`).join('');
}

function renderLegend(){
  const l=document.getElementById('legend');
  l.innerHTML=GENES.map(g=>`<div class="leg">
    <div class="leg-dot" style="background:${GENE_COLORS[g.id]}"></div>${g.name}
  </div>`).join('');
}

// ═══════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════
function randomize(unlockedOnly){
  GENES.forEach(g=>{
    if(unlockedOnly && locked[g.id]) return;
    const opts=[...g.options,...custom[g.id]];
    const opt=opts[Math.floor(Math.random()*opts.length)];
    sel[g.id]=opt.label; selOut[g.id]=opt.out;
  });
  renderGenesContainer();
  renderOutput();
  renderStrand();
}

function clearAll(){
  GENES.forEach(g=>{sel[g.id]=null;selOut[g.id]=null;locked[g.id]=false;});
  renderGenesContainer();
  renderOutput();
  renderStrand();
}

function copyPrompt(){
  const txt=getPlainPrompt();
  if(!txt){notify('Nada para copiar — selecione genes primeiro.');return;}
  navigator.clipboard.writeText(txt).then(()=>{
    const btn=document.getElementById('copy-btn');
    btn.textContent='✓ COPIADO';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='COPIAR PROMPT';btn.classList.remove('ok');},2000);
  });
}

// ═══════════════════════════════════════════════════
// IMPORT / EXPORT
// ═══════════════════════════════════════════════════
function exportJSON(){
  const data={
    version:'3.0',
    exported_at:new Date().toISOString(),
    description:'Sequenciador de Memórias — Chips Personalizados',
    instrucoes:'Edite os arrays em cada gene para adicionar seus proprios chips. Reimporte para carregar.',
    custom_chips:{}
  };
  GENES.forEach(g=>{
    data.custom_chips[g.id]=[...custom[g.id]];
  });
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='sequenciador-genes.json'; a.click();
  URL.revokeObjectURL(url);
  notify('JSON exportado!');
}

function importJSON(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.custom_chips) throw new Error('Formato inválido — falta custom_chips.');
      let added=0;
      GENES.forEach(g=>{
        const incoming=data.custom_chips[g.id];
        if(!Array.isArray(incoming)) return;
        incoming.forEach(chip=>{
          if(!chip.label||!chip.out) return;
          if(!custom[g.id].some(c=>c.label===chip.label)){
            custom[g.id].push({label:chip.label,out:chip.out});
            added++;
          }
        });
        localStorage.setItem('custom_'+g.id, JSON.stringify(custom[g.id]));
      });
      renderGenesContainer();
      notify(`${added} chips importados com sucesso!`);
    }catch(err){
      notify('Erro: '+err.message);
    }
  };
  reader.readAsText(file);
  input.value='';
}

// ═══════════════════════════════════════════════════
// NOTIFY
// ═══════════════════════════════════════════════════
function notify(msg){
  const el=document.getElementById('notify');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}

// ═══════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════
init();
</script>
